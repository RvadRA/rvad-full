version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rvad_retailos_db
    restart: always
    environment:
      POSTGRES_USER: rvad
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rvad_retailos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
